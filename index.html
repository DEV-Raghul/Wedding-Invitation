<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Veer & Zara - Wedding Invitation</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0b0c0e;
      --card-bg: rgba(20, 22, 26, 0.85);
      --gold-primary: #d4af37;
      --gold-light: #f3e5ab;
      --gold-dark: #aa7c11;
      --text-main: #f0f0f0;
      --text-muted: #a0a0a0;
      --border-gold: rgba(212, 175, 55, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Montserrat', sans-serif;
      overflow-x: hidden;
      display: flex;
      justify-content: center;
    }

    /* Outer Wrapper with Background Image & Pattern */
    .container {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      /* Dark luxury background pattern styling */
      background: 
        radial-gradient(circle at 50% 30%, rgba(212, 175, 55, 0.08), transparent 70%),
        radial-gradient(circle at 50% 80%, rgba(20, 20, 20, 0.9), #050505),
        repeating-linear-gradient(45deg, rgba(255,255,255,0.01) 0px, rgba(255,255,255,0.01) 2px, transparent 2px, transparent 8px);
      position: relative;
      box-shadow: 0 0 35px rgba(0, 0, 0, 0.95);
      border-left: 1px solid var(--border-gold);
      border-right: 1px solid var(--border-gold);
    }

    /* Falling Snow Canvas Layer */
    #snow-canvas {
      position: fixed;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      height: 100vh;
      pointer-events: none;
      z-index: 10;
    }

    h1, h2, h3, .gold-text {
      font-family: 'Cinzel', serif;
      color: var(--gold-primary);
      text-align: center;
    }

    /* Screen 1: Cover / Tap to Open */
    #cover-screen {
      position: fixed;
      top: 0;
      width: 100%;
      max-width: 480px;
      height: 100vh;
      background: radial-gradient(circle at center, #18191d 0%, #08080a 100%);
      z-index: 100;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: transform 1s cubic-bezier(0.77, 0, 0.175, 1), opacity 0.8s ease;
    }

    /* Background Geometric Gold Lines */
    .line-art {
      position: absolute;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .line-art::before, .line-art::after {
      content: '';
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: 1px;
      height: 100%;
      background: linear-gradient(to bottom, transparent, var(--gold-primary), transparent);
      opacity: 0.35;
    }

    /* Animated Tap Seal Button */
    .seal-btn {
      position: relative;
      width: 125px;
      height: 125px;
      border-radius: 50%;
      background: radial-gradient(circle, #2c2d30 0%, #111215 100%);
      border: 2px solid var(--gold-primary);
      box-shadow: 0 0 20px rgba(212, 175, 55, 0.35), inset 0 0 12px rgba(0,0,0,0.9);
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      animation: pulse 2.2s infinite;
      z-index: 2;
    }

    .seal-btn span {
      font-family: 'Cinzel', serif;
      font-size: 11px;
      letter-spacing: 2px;
      color: var(--gold-light);
      text-align: center;
      text-transform: uppercase;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0.5); }
      70% { box-shadow: 0 0 0 22px rgba(212, 175, 55, 0); }
      100% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0); }
    }

    /* Screen 2: Main Invitation Content */
    #content-screen {
      padding: 40px 20px;
      opacity: 0;
      transition: opacity 1s ease 0.4s;
      position: relative;
      z-index: 1;
    }

    .section {
      margin-bottom: 35px;
      text-align: center;
      border: 1px solid var(--border-gold);
      padding: 24px 16px;
      border-radius: 8px;
      background: var(--card-bg);
      backdrop-filter: blur(4px);
    }

    .names {
      font-size: 28px;
      margin: 8px 0;
      letter-spacing: 2px;
    }

    .sub-text {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    /* Countdown Grid */
    .countdown-grid {
      display: flex;
      justify-content: space-around;
      margin-top: 15px;
    }

    .time-box {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .time-box .num {
      font-size: 22px;
      font-weight: bold;
      color: var(--gold-light);
    }

    .time-box .label {
      font-size: 10px;
      color: var(--text-muted);
      letter-spacing: 1px;
    }

    /* Scratch Canvas Reveal */
    .scratch-container {
      position: relative;
      width: 100%;
      height: 100px;
      margin-top: 15px;
      border-radius: 6px;
      overflow: hidden;
    }

    .scratch-secret {
      position: absolute;
      width: 100%;
      height: 100%;
      background: #151619;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      border: 1px dashed var(--gold-primary);
    }

    canvas#scratch-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      cursor: pointer;
    }

    /* Form Inputs */
    .rsvp-form input, .rsvp-form select {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      background: #111214;
      border: 1px solid var(--border-gold);
      color: var(--text-main);
      border-radius: 4px;
    }

    .btn-submit {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, var(--gold-dark), var(--gold-primary));
      border: none;
      color: #000;
      font-weight: bold;
      font-family: 'Cinzel', serif;
      cursor: pointer;
      margin-top: 10px;
      border-radius: 4px;
    }

    /* State Handlers */
    .open-cover {
      transform: translateY(-100%);
      opacity: 0;
      pointer-events: none;
    }

    .show-content {
      opacity: 1 !important;
    }
  </style>
</head>
<body>

  <!-- Audio Element -->
  <audio id="bg-music" loop>
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
  </audio>

  <!-- Snowfall Overlay Canvas -->
  <canvas id="snow-canvas"></canvas>

  <div class="container">
    
    <!-- Cover Screen Overlay -->
    <div id="cover-screen">
      <div class="line-art"></div>
      <div class="seal-btn" onclick="openInvitation()">
        <span>Tap To<br>Open</span>
      </div>
    </div>

    <!-- Main Content -->
    <div id="content-screen">
      
      <div class="section">
        <p class="sub-text">WE ARE HONORED TO WELCOME YOU TO THE WEDDING OF</p>
        <h1 class="names">Veer</h1>
        <p class="sub-text">Son of Mr. & Mrs. Khan</p>
        <h1 style="font-size: 18px; margin: 8px 0;">&</h1>
        <h1 class="names">Zara</h1>
        <p class="sub-text">Daughter of Mr. & Mrs. Pathan</p>
      </div>

      <div class="section">
        <h2>Save The Date</h2>
        <p class="sub-text">Scratch below to reveal the date</p>
        <div class="scratch-container">
          <div class="scratch-secret">
            <h3 style="color: var(--gold-light);">August 31, 2026</h3>
            <p style="font-size: 12px;">Monday at 10:30 AM</p>
          </div>
          <canvas id="scratch-canvas"></canvas>
        </div>
      </div>

      <div class="section">
        <h2>Counting Down</h2>
        <div class="countdown-grid">
          <div class="time-box"><span class="num" id="days">00</span><span class="label">DAYS</span></div>
          <div class="time-box"><span class="num" id="hours">00</span><span class="label">HOURS</span></div>
          <div class="time-box"><span class="num" id="mins">00</span><span class="label">MINS</span></div>
          <div class="time-box"><span class="num" id="secs">00</span><span class="label">SECS</span></div>
        </div>
      </div>

      <div class="section rsvp-form">
        <h2>RSVP</h2>
        <input type="text" placeholder="Your Name" required />
        <input type="email" placeholder="Email Address" required />
        <select>
          <option value="" disabled selected>Will you attend?</option>
          <option value="yes">Joyfully Accept</option>
          <option value="no">Regretfully Decline</option>
        </select>
        <button class="btn-submit">CONFIRM ATTENDANCE</button>
      </div>

    </div>
  </div>

  <script>
    // 1. Open Gate & Play Audio
    function openInvitation() {
      document.getElementById('cover-screen').classList.add('open-cover');
      document.getElementById('content-screen').classList.add('show-content');
      
      const audio = document.getElementById('bg-music');
      audio.play().catch(() => console.log("Autoplay restricted"));
      
      initScratchCard();
      startCountdown();
    }

    // 2. Falling Snow Effect
    const snowCanvas = document.getElementById('snow-canvas');
    const snowCtx = snowCanvas.getContext('2d');

    function resizeSnowCanvas() {
      snowCanvas.width = snowCanvas.offsetWidth;
      snowCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeSnowCanvas);
    resizeSnowCanvas();

    const particles = Array.from({ length: 45 }, () => ({
      x: Math.random() * snowCanvas.width,
      y: Math.random() * snowCanvas.height,
      radius: Math.random() * 2.2 + 0.8,
      speedY: Math.random() * 1.2 + 0.4,
      speedX: Math.random() * 0.5 - 0.25,
      opacity: Math.random() * 0.7 + 0.3
    }));

    function drawSnow() {
      snowCtx.clearRect(0, 0, snowCanvas.width, snowCanvas.height);
      
      particles.forEach(p => {
        snowCtx.beginPath();
        snowCtx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        snowCtx.fillStyle = `rgba(243, 229, 171, ${p.opacity})`;
        snowCtx.fill();

        p.y += p.speedY;
        p.x += p.speedX;

        if (p.y > snowCanvas.height) {
          p.y = -5;
          p.x = Math.random() * snowCanvas.width;
        }
      });

      requestAnimationFrame(drawSnow);
    }
    drawSnow();

    // 3. Live Countdown Timer
    function startCountdown() {
      const targetDate = new Date("August 31, 2026 10:30:00").getTime();
      
      setInterval(() => {
        const now = new Date().getTime();
        const diff = targetDate - now;

        if (diff > 0) {
          document.getElementById("days").innerText = String(Math.floor(diff / (1000 * 60 * 60 * 24))).padStart(2, '0');
          document.getElementById("hours").innerText = String(Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60))).padStart(2, '0');
          document.getElementById("mins").innerText = String(Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60))).padStart(2, '0');
          document.getElementById("secs").innerText = String(Math.floor((diff % (1000 * 60)) / 1000)).padStart(2, '0');
        }
      }, 1000);
    }

    // 4. Scratch Card Reveal Canvas
    function initScratchCard() {
      const canvas = document.getElementById('scratch-canvas');
      const ctx = canvas.getContext('2d');
      
      canvas.width = canvas.offsetWidth;
      canvas.height = canvas.offsetHeight;

      ctx.fillStyle = '#aa7c11';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      ctx.font = '12px Montserrat';
      ctx.fillStyle = '#000000';
      ctx.textAlign = 'center';
      ctx.fillText('Scratch Here', canvas.width / 2, canvas.height / 2 + 4);

      let isDrawing = false;

      function scratch(e) {
        if (!isDrawing) return;
        const rect = canvas.getBoundingClientRect();
        const x = (e.clientX || e.touches[0].clientX) - rect.left;
        const y = (e.clientY || e.touches[0].clientY) - rect.top;

        ctx.globalCompositeOperation = 'destination-out';
        ctx.beginPath();
        ctx.arc(x, y, 16, 0, Math.PI * 2);
        ctx.fill();
      }

      canvas.addEventListener('mousedown', () => isDrawing = true);
      canvas.addEventListener('mouseup', () => isDrawing = false);
      canvas.addEventListener('mousemove', scratch);

      canvas.addEventListener('touchstart', () => isDrawing = true);
      canvas.addEventListener('touchend', () => isDrawing = false);
      canvas.addEventListener('touchmove', scratch);
    }
  </script>
</body>
</html>
